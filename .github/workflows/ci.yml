name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/Home-Page/"]
    env:
      CI: true
      SITE_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:html
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/generate-social-previews.mjs --output-dir .cache/social-preview-cleanup
        if: ${{ matrix.base == '/' }}
      - run: pnpm test:e2e
      - run: pnpm audit:lighthouse /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-audits-${{ strategy.job-index }}
          path: .cache/audits/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-failures-${{ strategy.job-index }}
          path: test-results/
          retention-days: 14
